<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chinese Flashcards Week 1-4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#222;font-family:Arial,"Noto Sans Thai",sans-serif}header{background:white;padding:18px;text-align:center;border-bottom:1px solid #ddd;position:sticky;top:0}h1{margin:0;font-size:24px}.wrap{max-width:720px;margin:auto;padding:24px 16px}.grid{display:grid;gap:14px}button{border:0;border-radius:14px;padding:16px;font-size:16px;background:white;box-shadow:0 2px 10px #0001;cursor:pointer}.week{text-align:left}.week b{display:block;font-size:18px;margin-bottom:5px}.week span{color:#666}.all{background:#222;color:#fff}.hidden{display:none!important}.progress{text-align:center;color:#666;margin:10px 0 18px}.cardwrap{perspective:1000px;max-width:600px;margin:auto auto 20px}.card{height:330px;position:relative;transform-style:preserve-3d;transition:.45s;cursor:pointer}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;background:#fff;box-shadow:0 8px 30px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center}.word{font-size:88px;font-weight:bold}.hint{margin-top:20px;color:#999}.back{transform:rotateY(180deg)}.back .word{font-size:64px}.pinyin{font-size:30px;margin:12px 0}.meaning{font-size:23px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:600px;margin:auto}.home{display:block;margin:18px auto;background:transparent;box-shadow:none;color:#555}@media(max-width:500px){.card{height:300px}.word{font-size:70px}.back .word{font-size:52px}}
</style></head><body><header><h1>🇨🇳 Chinese Flashcards</h1></header>
<section id="home" class="wrap"><h2>เลือกชุดคำศัพท์</h2><div class="grid">
<button class="week" onclick="start(1)"><b>Week 1</b><span>24 คำ</span></button>
<button class="week" onclick="start(2)"><b>Week 2</b><span>15 คำ</span></button>
<button class="week" onclick="start(3)"><b>Week 3</b><span>18 คำ</span></button>
<button class="week" onclick="start(4)"><b>Week 4</b><span>15 คำ</span></button>
<button class="week all" onclick="start(0)"><b>🎲 Random — Week 1–4</b><span>รวมทั้งหมด 72 คำ</span></button>
</div></section>
<section id="study" class="wrap hidden"><h2 id="title" style="text-align:center"></h2><div id="progress" class="progress"></div>
<div class="cardwrap"><div id="card" class="card" onclick="flip()"><div class="face"><div id="front" class="word"></div><div class="hint">แตะการ์ดเพื่อดูคำอ่านและความหมาย</div></div><div class="face back"><div id="back" class="word"></div><div id="py" class="pinyin"></div><div id="meaning" class="meaning"></div></div></div></div>
<div class="controls"><button onclick="prev()">← ก่อนหน้า</button><button onclick="next()">ถัดไป →</button><button onclick="shuffle()">🔀 Shuffle</button><button onclick="resetDeck()">↻ Reset</button></div>
<button class="home" onclick="home()">← กลับหน้าหลัก</button></section>
<script>
const W={"1": [["我", "wǒ", "ฉัน / ผม"], ["你", "nǐ", "คุณ / เธอ"], ["他", "tā", "เขา (ผู้ชาย)"], ["她", "tā", "เธอ (ผู้หญิง)"], ["好", "hǎo", "ดี / สวัสดี"], ["一", "yī", "หนึ่ง"], ["二", "èr", "สอง"], ["三", "sān", "สาม"], ["四", "sì", "สี่"], ["五", "wǔ", "ห้า"], ["六", "liù", "หก"], ["七", "qī", "เจ็ด"], ["八", "bā", "แปด"], ["九", "jiǔ", "เก้า"], ["十", "shí", "สิบ"], ["百", "bǎi", "ร้อย"], ["千", "qiān", "พัน"], ["万", "wàn", "หมื่น"], ["大", "dà", "ใหญ่"], ["不", "bù", "ไม่"], ["口", "kǒu", "ปาก / ลักษณนามของคนในครอบครัว"], ["白", "bái", "สีขาว"], ["马", "mǎ", "ม้า"], ["女", "nǚ", "ผู้หญิง / หญิง"]], "2": [["忙", "máng", "ยุ่ง"], ["吗", "ma", "ไหม / หรือไม่"], ["很", "hěn", "มาก / ค่อนข้าง"], ["汉语", "Hànyǔ", "ภาษาจีน"], ["泰语", "Tàiyǔ", "ภาษาไทย"], ["英语", "Yīngyǔ", "ภาษาอังกฤษ"], ["难", "nán", "ยาก"], ["太", "tài", "เกินไป / มากเกินไป"], ["爸爸", "bàba", "พ่อ / คุณพ่อ"], ["妈妈", "māma", "แม่ / คุณแม่"], ["妹妹", "mèimei", "น้องสาว"], ["弟弟", "dìdi", "น้องชาย"], ["姐姐", "jiějie", "พี่สาว"], ["男", "nán", "ผู้ชาย / ชาย"], ["白", "bái", "สีขาว"]], "3": [["学", "xué", "เรียน / ศึกษา"], ["英语", "Yīngyǔ", "ภาษาอังกฤษ"], ["汉语", "Hànyǔ", "ภาษาจีน"], ["对", "duì", "ถูก / ใช่ / ต่อ"], ["明天", "míngtiān", "พรุ่งนี้"], ["今天", "jīntiān", "วันนี้"], ["昨天", "zuótiān", "เมื่อวาน"], ["见", "jiàn", "พบ / เจอ / เห็น"], ["去", "qù", "ไป"], ["邮", "yóu", "ไปรษณีย์ / ส่งทางไปรษณีย์"], ["局", "jú", "สำนักงาน / หน่วยงาน"], ["寄", "jì", "ส่ง / ฝากส่ง"], ["信", "xìn", "จดหมาย / ข่าวสาร"], ["银行", "yínháng", "ธนาคาร"], ["取", "qǔ", "ถอน / รับ / เอา"], ["钱", "qián", "เงิน"], ["北京", "Běijīng", "ปักกิ่ง"], ["学校", "xuéxiào", "โรงเรียน"]], "4": [["年", "nián", "ปี"], ["月", "yuè", "เดือน / พระจันทร์"], ["号", "hào", "วันที่ / หมายเลข"], ["日", "rì", "วัน / วันที่ / พระอาทิตย์"], ["星期", "xīngqī", "สัปดาห์ / วันในสัปดาห์"], ["几", "jǐ", "กี่ / เท่าไร"], ["哪儿", "nǎr", "ที่ไหน"], ["那儿", "nàr", "ที่นั่น"], ["回", "huí", "กลับ / กลับไป"], ["来", "lái", "มา"], ["学校", "xuéxiào", "โรงเรียน"], ["再见", "zàijiàn", "ลาก่อน / แล้วพบกันใหม่"], ["对不起", "duìbuqǐ", "ขอโทษ"], ["没关系", "méiguānxi", "ไม่เป็นไร"], ["天安门", "Tiān'ānmén", "เทียนอันเหมิน"]]};let deck=[],i=0,current=1;
function start(n){current=n;deck=n===0?[...W["1"],...W["2"],...W["3"],...W["4"]]:[...W[String(n)]];i=0;document.querySelector("#home").classList.add("hidden");document.querySelector("#study").classList.remove("hidden");document.querySelector("#title").textContent=n===0?"🎲 Random — Week 1–4":"Week "+n;show()}
function show(){let x=deck[i];document.querySelector("#card").classList.remove("flip");document.querySelector("#front").textContent=x[0];document.querySelector("#back").textContent=x[0];document.querySelector("#py").textContent=x[1];document.querySelector("#meaning").textContent=x[2];document.querySelector("#progress").textContent=(i+1)+" / "+deck.length}
function flip(){document.querySelector("#card").classList.toggle("flip")}function next(){i=(i+1)%deck.length;show()}function prev(){i=(i-1+deck.length)%deck.length;show()}
function shuffle(){for(let j=deck.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[deck[j],deck[k]]=[deck[k],deck[j]]}i=0;show()}
function resetDeck(){start(current)}function home(){document.querySelector("#study").classList.add("hidden");document.querySelector("#home").classList.remove("hidden")}
document.addEventListener("keydown",e=>{if(document.querySelector("#study").classList.contains("hidden"))return;if(e.code==="Space"){e.preventDefault();flip()}else if(e.key==="ArrowRight")next();else if(e.key==="ArrowLeft")prev()})
</script></body></html>
