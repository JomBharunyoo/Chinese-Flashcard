<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinese Flashcards</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f5f5f7;color:#111;display:flex;justify-content:center;min-height:100vh}
.app{width:min(680px,100%);padding:22px 16px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0}.count{color:#666;font-size:14px}
.card{height:430px;perspective:1000px;cursor:pointer;margin:14px 0}.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:white;border-radius:24px;box-shadow:0 8px 30px #00000012;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center}
.back{transform:rotateY(180deg)}.hanzi{font-size:150px;line-height:1;font-weight:500}.pinyin{font-size:34px;margin:18px 0 8px}.meaning{font-size:27px}.hint{color:#999;font-size:14px;margin-top:22px}
.controls{display:flex;gap:10px}.btn{flex:1;border:0;border-radius:14px;padding:15px;font-size:17px;background:#111;color:white}.btn.secondary{background:white;color:#111;box-shadow:0 2px 10px #00000012}
.tools{display:flex;gap:8px;margin-top:12px}.tools button{flex:1;padding:10px;border:0;border-radius:10px;background:#e8e8ed}
.progress{height:7px;background:#ddd;border-radius:9px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:#111;width:0}
.small{font-size:13px;color:#777;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="app">
 <div class="top"><h1>🀄 Chinese Flashcards</h1><div class="count" id="count"></div></div>
 <div class="progress"><div class="bar" id="bar"></div></div>
 <div class="card" id="card" onclick="flip()">
  <div class="inner">
   <div class="face"><div class="hanzi" id="front"></div><div class="hint">แตะเพื่อดูคำตอบ</div></div>
   <div class="face back"><div class="hanzi" id="backHanzi"></div><div class="pinyin" id="pinyin"></div><div class="meaning" id="meaning"></div><div class="hint">แตะเพื่อกลับด้าน</div></div>
  </div>
 </div>
 <div class="controls">
  <button class="btn secondary" onclick="prev(event)">← ก่อนหน้า</button>
  <button class="btn" onclick="next(event)">ถัดไป →</button>
 </div>
 <div class="tools">
  <button onclick="shuffle()">🔀 สุ่ม</button>
  <button onclick="resetDeck()">↻ เริ่มใหม่</button>
 </div>
 <div class="small">ทั้งหมด 24 คำ · กด Space เพื่อเปิดการ์ด · ← → เพื่อเปลี่ยนใบ</div>
</div>
<script>
const words=[
["我","wǒ","ฉัน / ผม"],["你","nǐ","คุณ / เธอ"],["他","tā","เขา (ผู้ชาย)"],["她","tā","เธอ / เขา (ผู้หญิง)"],
["好","hǎo","ดี / สบายดี"],["一","yī","หนึ่ง"],["二","èr","สอง"],["三","sān","สาม"],["四","sì","สี่"],["五","wǔ","ห้า"],
["六","liù","หก"],["七","qī","เจ็ด"],["八","bā","แปด"],["九","jiǔ","เก้า"],["十","shí","สิบ"],
["百","bǎi","ร้อย"],["千","qiān","พัน"],["万","wàn","หมื่น"],["大","dà","ใหญ่"],["不","bù","ไม่"],
["口","kǒu","ปาก"],["白","bái","สีขาว"],["马","mǎ","ม้า"],["女","nǚ","ผู้หญิง / หญิง"]
];
let deck=[...words],i=0;
const $=x=>document.getElementById(x);
function render(){let w=deck[i];$("front").textContent=w[0];$("backHanzi").textContent=w[0];$("pinyin").textContent=w[1];$("meaning").textContent=w[2];$("count").textContent=`${i+1} / ${deck.length}`;$("bar").style.width=((i+1)/deck.length*100)+"%";$("card").classList.remove("flipped")}
function flip(){ $("card").classList.toggle("flipped") }
function next(e){e.stopPropagation();i=(i+1)%deck.length;render()}
function prev(e){e.stopPropagation();i=(i-1+deck.length)%deck.length;render()}
function shuffle(){deck.sort(()=>Math.random()-.5);i=0;render()}
function resetDeck(){deck=[...words];i=0;render()}
document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();flip()}if(e.key==="ArrowRight")next(e);if(e.key==="ArrowLeft")prev(e)});
render();
</script>
</body>
</html>
